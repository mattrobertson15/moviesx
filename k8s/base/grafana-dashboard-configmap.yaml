apiVersion: v1
kind: ConfigMap
metadata:
  name: moviesx-overview-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: moviesx
data:
  moviesx-overview.json: |
    {
      "schemaVersion": 38,
      "uid": "moviesx-overview",
      "title": "moviesx Overview",
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Request Rate",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "targets": [
            {
              "expr": "sum by(handler, code) (rate(http_requests_total[5m]))",
              "legendFormat": "{{handler}} {{code}}"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Latency p99",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum by(handler, le) (rate(http_request_duration_seconds_bucket[5m])))",
              "legendFormat": "{{handler}}"
            }
          ]
        }
      ],
      "time": {"from": "now-1h", "to": "now"},
      "refresh": "15s"
    }
