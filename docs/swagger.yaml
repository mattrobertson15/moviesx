      - description: Name search substring (min 2 chars)
        in: query
        name: q
        type: string
      - description: Page number (default 1)
        in: query
        name: pageNumber
        type: integer
      - description: Page size (default 20, max 100)
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_mbr_moviesx_internal_store.Page-github_com_mbr_moviesx_internal_store_Actor'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List actors
      tags:
      - actors
  /api/actors/{id}:
    get:
      parameters:
      - description: Actor ID (e.g. nm0000001)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_mbr_moviesx_internal_store.Actor'
        "400":
          description: Bad Request
