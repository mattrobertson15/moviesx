      - description: Title search substring (min 2 chars)
        in: query
        name: q
        type: string
      - description: Genre filter
        in: query
        name: genre
        type: string
      - description: Release year
        in: query
        name: year
        type: integer
      - description: Minimum rating
        in: query
        name: rating
        type: number
      - description: Filter by actor ID
        in: query
        name: actorId
        type: string
      - description: Page number (default 1)
        in: query
        name: pageNumber
        type: integer
      - description: Page size (default 20, max 100)
